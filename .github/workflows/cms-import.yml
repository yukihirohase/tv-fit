name: CMS import

# data/*.csv を EmDash（https://tv-fit.com）へ「下書き」として一括登録する。
# - main に CSV の変更がマージされたとき自動実行
# - Actions 画面の「Run workflow」から手動実行も可能
# 通常は公開操作を行わない。取り込んだ下書きは管理画面で確認してから公開する。
# 例外：手動実行で publish_compatibility をオンにしたときだけ、CSVと同じ内容の適合情報の下書きを公開する
# （参照先のテレビ・スタンドが公開済みのものに限る）。

on:
  push:
    branches: [main]
    paths:
      - 'data/*.csv'
  workflow_dispatch:
    inputs:
      fill_blanks:
        description: 'CMSで空欄の項目だけCSVの値で埋める（下書きのみ・既存値は変更しない）'
        type: boolean
        default: false
      include_published:
        description: '空欄補完で公開済みの項目も対象にする（公開状態のまま空欄だけ埋める）'
        type: boolean
        default: false
      fill_limit:
        description: '空欄補完の最大件数（試行用。空欄なら全件）'
        type: string
        default: ''
      publish_compatibility:
        description: '適合情報の下書きを公開する（CSVと同じ内容で、参照先のテレビ・スタンドが公開済みのものだけ。新規登録は行わない）'
        type: boolean
        default: false
      publish_limit:
        description: '公開の最大件数（試行用。空欄なら全件）'
        type: string
        default: ''
      chain:
        description: '自動継続の通し番号（通常は 0 のまま）'
        type: string
        default: '0'

permissions:
  contents: read
  actions: write   # 時間切れのとき、続きの実行を自分で起動するため

concurrency:
  group: cms-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      EMDASH_BASE_URL: ${{ vars.EMDASH_BASE_URL || 'https://tv-fit.com' }}
      EMDASH_API_TOKEN: ${{ secrets.EMDASH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: CSV を検証（書込なし）
        run: npm run cms:import -- --directory data

      - name: CMS へ下書きとして登録
        if: env.EMDASH_API_TOKEN != ''
        # 登録済みの行はスキップされるので、一時的なエラー（HTTP 429/502/503/504、接続失敗、
        # デプロイ直後の Durable Object 再起動）のときは間隔を空けて続きから再実行する。
        # GitHub Actions の1実行の上限（6時間）に近づいたら、続きの実行を自分で起動して終了する。
        # 内容の不一致など、それ以外のエラーはすぐに止める。
        timeout-minutes: 345
        env:
          FILL_BLANKS: ${{ inputs.fill_blanks && '--fill-blanks' || '' }}
          INCLUDE_PUBLISHED: ${{ inputs.fill_blanks && inputs.include_published && '--include-published' || '' }}
          FILL_LIMIT: ${{ inputs.fill_limit && format('--fill-limit {0}', inputs.fill_limit) || '' }}
          PUBLISH: ${{ inputs.publish_compatibility && '--publish-compatibility' || '' }}
          PUBLISH_LIMIT: ${{ inputs.publish_compatibility && inputs.publish_limit && format('--publish-limit {0}', inputs.publish_limit) || '' }}
          IN_PUBLISH: ${{ inputs.publish_compatibility || false }}
          IN_PUBLISH_LIMIT: ${{ inputs.publish_limit || '' }}
          CHAIN: ${{ inputs.chain || '0' }}
          MAX_CHAIN: '12'
          BUDGET_SECONDS: '19800'   # 330分。これを過ぎたら次の実行に引き継ぐ
          GH_TOKEN: ${{ github.token }}
          IN_FILL_BLANKS: ${{ inputs.fill_blanks || false }}
          IN_INCLUDE_PUBLISHED: ${{ inputs.include_published || false }}
          IN_FILL_LIMIT: ${{ inputs.fill_limit || '' }}
        shell: bash
        run: |
          set -o pipefail
          retryable='HTTP (429|502|503|504)|Durable Object reset|CMS APIへ接続できませんでした'
          continue_next() {
            if [ "$CHAIN" -ge "$MAX_CHAIN" ]; then
              echo "::error::自動継続の上限（${MAX_CHAIN}回）に達しました。Run workflow で続きから実行してください。"
              exit 1
            fi
            next=$((CHAIN + 1))
            echo "時間の上限に近いため、続きを新しい実行（${next}回目の継続）に引き継ぎます。"
            gh workflow run cms-import.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f chain="$next" -f fill_blanks="$IN_FILL_BLANKS" -f include_published="$IN_INCLUDE_PUBLISHED" -f fill_limit="$IN_FILL_LIMIT" \
              -f publish_compatibility="$IN_PUBLISH" -f publish_limit="$IN_PUBLISH_LIMIT"
            exit 0
          }
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            remaining=$((BUDGET_SECONDS - SECONDS))
            [ "$remaining" -le 120 ] && continue_next
            echo "::group::取込 ${attempt}回目（残り約$((remaining / 60))分）"
            set +e
            timeout "${remaining}s" npm run cms:import -- --directory data --apply $FILL_BLANKS $INCLUDE_PUBLISHED $FILL_LIMIT $PUBLISH $PUBLISH_LIMIT 2>&1 | tee import.log
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ] && grep -qE '取込完了|空欄補完: 更新|件数指定のため|公開完了' import.log; then
              grep -E '取込完了|空欄補完|公開対象|公開完了' import.log || true
              exit 0
            fi
            [ "$status" -eq 124 ] && continue_next
            if ! grep -qE "$retryable" import.log; then
              echo "::error::一時的ではないエラーで中止しました（上のログを確認してください）。"
              exit 1
            fi
            echo "一時的なエラーのため 20 秒後に続きから再実行します。"
            sleep 20
          done

      - name: 公開ページの応答時間を確認
        if: inputs.publish_compatibility && env.EMDASH_API_TOKEN != ''
        continue-on-error: true
        run: |
          for path in / /sitemap.xml; do
            curl -sS -o /dev/null -w "${path} HTTP %{http_code} %{time_total}s\n" "${EMDASH_BASE_URL}${path}" || true
          done

      - name: API トークン未設定の案内
        if: env.EMDASH_API_TOKEN == ''
        run: |
          echo "::warning::EMDASH_API_TOKEN が未設定のため、検証だけ行い登録はしていません。GitHub の Settings → Secrets and variables → Actions に EMDASH_API_TOKEN を追加してください（docs/CSV.md 参照）。"
