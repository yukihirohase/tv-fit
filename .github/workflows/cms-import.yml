name: CMS import

# data/*.csv を EmDash（https://tv-fit.com）へ「下書き」として一括登録する。
# - main に CSV の変更がマージされたとき自動実行
# - Actions 画面の「Run workflow」から手動実行も可能
# 公開操作は行わない。取り込んだ下書きは管理画面で確認してから公開する。

on:
  push:
    branches: [main]
    paths:
      - 'data/*.csv'
  workflow_dispatch:
    inputs:
      fill_blanks:
        description: 'CMSで空欄の項目だけCSVの値で埋める（下書きのみ・既存値は変更しない）'
        type: boolean
        default: false
      include_published:
        description: '空欄補完で公開済みの項目も対象にする（公開状態のまま空欄だけ埋める）'
        type: boolean
        default: false
      fill_limit:
        description: '空欄補完の最大件数（試行用。空欄なら全件）'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cms-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      EMDASH_BASE_URL: ${{ vars.EMDASH_BASE_URL || 'https://tv-fit.com' }}
      EMDASH_API_TOKEN: ${{ secrets.EMDASH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: CSV を検証（書込なし）
        run: npm run cms:import -- --directory data

      - name: CMS へ下書きとして登録
        if: env.EMDASH_API_TOKEN != ''
        # 無料プランのCPU時間制限で途中に HTTP 503 が出ることがある。登録済みの行は
        # スキップされるので、503 のときだけ間隔を空けて最大 MAX_ATTEMPTS 回まで続きから再実行する。
        # 503 以外のエラー（内容の不一致など）はすぐに止める。
        timeout-minutes: 340
        env:
          FILL_BLANKS: ${{ inputs.fill_blanks && '--fill-blanks' || '' }}
          INCLUDE_PUBLISHED: ${{ inputs.fill_blanks && inputs.include_published && '--include-published' || '' }}
          FILL_LIMIT: ${{ inputs.fill_limit && format('--fill-limit {0}', inputs.fill_limit) || '' }}
          MAX_ATTEMPTS: '300'
        shell: bash
        run: |
          set -o pipefail
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::取込 ${attempt}回目"
            npm run cms:import -- --directory data --apply $FILL_BLANKS $INCLUDE_PUBLISHED $FILL_LIMIT 2>&1 | tee import.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ] && grep -qE '取込完了|空欄補完: 更新|件数指定のため' import.log; then
              echo "::endgroup::"
              grep -E '取込完了|空欄補完' import.log || true
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -q 'HTTP 503' import.log; then
              echo "::error::503 以外のエラーで中止しました（上のログを確認してください）。"
              exit 1
            fi
            echo "HTTP 503 のため 20 秒後に続きから再実行します（${attempt}/${MAX_ATTEMPTS}）。"
            sleep 20
          done
          echo "::error::再実行の上限に達しました。もう一度 Run workflow で続きから実行してください。"
          exit 1

      - name: API トークン未設定の案内
        if: env.EMDASH_API_TOKEN == ''
        run: |
          echo "::warning::EMDASH_API_TOKEN が未設定のため、検証だけ行い登録はしていません。GitHub の Settings → Secrets and variables → Actions に EMDASH_API_TOKEN を追加してください（docs/CSV.md 参照）。"
